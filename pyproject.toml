[project]
authors = [
  {name = "mm21", email = "mm21.dev@gmail.com"}
]
classifiers = [
  # Get the list of trove classifiers here: https://pypi.org/classifiers/
  "Development Status :: 4 - Beta",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",  # managed by pyprojkit
  "Programming Language :: Python :: 3.12",  # managed by pyprojkit
  "Programming Language :: Python :: 3.13",  # managed by pyprojkit
  "Programming Language :: Python :: 3.14",  # managed by pyprojkit
  "Programming Language :: Python :: Implementation :: CPython",
  "Typing :: Typed"
]
dependencies = [
  "pydantic>=2,<3",
  "python-dotenv>=1.0.1,<2",
  "pyyaml>=6.0.2,<7",
  "requests>=2.31.0,<3",
  "trilium-client>=0.2.0,<0.3.0",
  "typecraft>=0.4.0",
  "typer>=0.26.7"
]
description = "Python SDK and CLI toolkit for Trilium Notes"
license = "AGPL-3.0-only"
name = "trilium-alchemy"
readme = "README.pypi.md"
requires-python = ">=3.12,<3.15"  # managed by pyprojkit
version = "0.9.0"

[project.scripts]
trilium-alchemy = "trilium_alchemy.tools.cli.main:run"

[project.urls]
documentation = "https://mm21.github.io/trilium-alchemy/"
homepage = "https://github.com/mm21/trilium-alchemy"

[dependency-groups]
dev = [
  "furo>=2023.5.20,<2024",
  "mkinit",
  "myst-parser>=2.0.0,<3",
  "pexpect>=4.9.0,<5",
  "pyprojkit[all]>=0.3.1,<0.4.0",
  "pytest-dependency>=0.6.1,<0.7.0",
  "sphinx>=7.0.1,<8",
  "sphinx-autodoc2 @ git+https://github.com/mm21/sphinx-autodoc2.git",
  "sphinx-copybutton>=0.5.2,<0.6.0",
  "sphinxcontrib-plantuml>=0.25,<0.26",
  "sphinxcontrib-typer>=0.9.0,<0.10.0",
  "types-requests>=2.31.0.8,<3"
]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.11.6,<0.12.0"]

[tool.autoflake]  # managed by pyprojkit
in_place = true
recursive = true
remove-all-unused-imports = true
remove-unused-variables = true

[tool.black]  # managed by pyprojkit
quiet = true
target-version = [
  "py312",
  "py313",
  "py314"
]

[tool.coverage.report]  # managed by pyprojkit
exclude_lines = [
  "if TYPE_CHECKING:",
  "\\.\\.\\.$"
]

[tool.coverage.run]  # managed by pyprojkit
data_file = "__cache__/.coverage"

[tool.docfmt]  # managed by pyprojkit
force-reflow = true
in-place = true
recursive = true
summary-on-own-line = true

[tool.doit]  # managed by pyprojkit
dep_file = "__cache__/.doit.db"
verbosity = 2

[tool.isort]  # managed by pyprojkit
profile = "black"
quiet = true

[tool.mypy]  # managed by pyprojkit
ignore_missing_imports = true
python_version = "3.12"

[tool.nox]  # managed by pyprojkit
default_venv_backend = "uv"
envdir = "__cache__/nox"

[tool.pyprojkit]  # managed by pyprojkit
managed = [
  "tool.autoflake",
  "tool.black",
  "tool.coverage.report",
  "tool.coverage.run",
  "tool.docfmt",
  "tool.doit",
  "tool.isort",
  "tool.mypy",
  "tool.nox",
  "tool.pytest.ini_options",
  "tool.tomlsort"
]

[tool.pytest.ini_options]  # managed by pyprojkit
addopts = "--import-mode=importlib -s -v -rA"
cache_dir = "__cache__/pytest"
testpaths = "test"

[tool.tomlsort]  # managed by pyprojkit
sort_first = [
  "project",
  "dependency-groups",
  "build-system"
]
sort_table_keys = true
spaces_before_inline_comment = 2

[tool.uv.sources]
mkinit = {git = "https://github.com/mm21/mkinit.git"}
