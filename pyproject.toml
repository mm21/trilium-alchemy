# managed (in part) by pyprojkit: https://github.com/mm21/pyprojkit

[project]
authors = [
  {name = "mm21", email = "mm21.dev@gmail.com"}
]
classifiers = [
  # Get the list of trove classifiers here: https://pypi.org/classifiers/
  "Development Status :: 4 - Beta",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",  # pyprojkit-managed
  "Programming Language :: Python :: 3.12",  # pyprojkit-managed
  "Programming Language :: Python :: 3.13",  # pyprojkit-managed
  "Programming Language :: Python :: 3.14",  # pyprojkit-managed
  "Programming Language :: Python :: Implementation :: CPython",
  "Typing :: Typed"
]
dependencies = [
  "pydantic>=2,<3",
  "python-dotenv>=1.0.1,<2",
  "pyyaml>=6.0.2,<7",
  "requests>=2.31.0,<3",
  "trilium-client>=0.2.0,<0.3.0",
  "typecraft>=0.4.0",
  "typer>=0.26.7"
]
description = "Python SDK and CLI toolkit for Trilium Notes"
license = "AGPL-3.0-only"
name = "trilium-alchemy"
readme = "README.pypi.md"
requires-python = ">=3.12,<4.0"  # pyprojkit-managed
version = "0.9.0"

[project.scripts]
trilium-alchemy = "trilium_alchemy.tools.cli.main:run"

[project.urls]
documentation = "https://mm21.github.io/trilium-alchemy/"
homepage = "https://github.com/mm21/trilium-alchemy"

[dependency-groups]
dev = [
  "furo>=2023.5.20,<2024",
  "mkinit",
  "myst-parser>=2.0.0,<3",
  "pexpect>=4.9.0,<5",
  "pyprojkit[all]>=0.6.0,<0.7.0",
  "pytest-dependency>=0.6.1,<0.7.0",
  "sphinx>=7.0.1,<8",
  "sphinx-autodoc2 @ git+https://github.com/mm21/sphinx-autodoc2.git",
  "sphinx-copybutton>=0.5.2,<0.6.0",
  "sphinxcontrib-plantuml>=0.25,<0.26",
  "sphinxcontrib-typer>=0.9.0,<0.10.0",
  "types-docutils>=0.23.0.20260923",
  "types-pyyaml>=6.0.12.20260906",
  "types-requests>=2.31.0.8,<3"
]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.11.6,<0.12.0"]

[tool.autoflake]
in_place = true  # pyprojkit-managed
recursive = true  # pyprojkit-managed
remove-all-unused-imports = true  # pyprojkit-managed
remove-unused-variables = true  # pyprojkit-managed

[tool.black]
quiet = true  # pyprojkit-managed
target-version = [
  "py312",
  "py313",
  "py314"
]  # pyprojkit-managed

[tool.coverage.report]
exclude_lines = [
  "if TYPE_CHECKING:",
  "\\.\\.\\.$"
]  # pyprojkit-managed

[tool.coverage.run]
data_file = "__cache__/.coverage"  # pyprojkit-managed

[tool.docfmt]
force-reflow = true  # pyprojkit-managed
in-place = true  # pyprojkit-managed
recursive = true  # pyprojkit-managed
summary-on-own-line = true  # pyprojkit-managed

[tool.doit]
dep_file = "__cache__/.doit.db"  # pyprojkit-managed
verbosity = 2  # pyprojkit-managed

[tool.isort]
profile = "black"  # pyprojkit-managed
quiet = true  # pyprojkit-managed

[tool.mypy]
check_untyped_defs = true  # pyprojkit-managed
ignore_missing_imports = true  # pyprojkit-managed
python_version = "3.12"  # pyprojkit-managed

[tool.nox]
default_venv_backend = "uv"  # pyprojkit-managed
envdir = "__cache__/nox"  # pyprojkit-managed

[tool.pyright]
pythonVersion = "3.12"  # pyprojkit-managed

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -s -v -rA"  # pyprojkit-managed
cache_dir = "__cache__/pytest"  # pyprojkit-managed
testpaths = "test"  # pyprojkit-managed

[tool.tomlsort]
sort_first = [
  "project",
  "dependency-groups",
  "build-system"
]  # pyprojkit-managed
sort_table_keys = true  # pyprojkit-managed
spaces_before_inline_comment = 2  # pyprojkit-managed

[tool.uv.sources]
mkinit = {git = "https://github.com/mm21/mkinit.git"}
